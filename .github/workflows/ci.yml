#
# Every job starts from a fresh Ubuntu runner, so this is also the clean-install
# test of the README.  Actions are pinned to commit SHAs; the token is read-only.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Data guard, unit and security tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0               # the guard checks the whole history
          persist-credentials: false
          # On a pull request, check its own commits, not the test merge commit GitHub makes for it: that one
          # carries the opener's GitHub e-mail and never lands in the history.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Data guard (tree and history)
        env:
          DATA_GUARD_PATTERNS: ${{ secrets.DATA_GUARD_PATTERNS }}   # team words, never in the repo
        run: |
          python3 tools/data_guard.py --tree
          python3 tools/data_guard.py --history
      - name: Compile
        run: python3 -m compileall -q meshdoctor tests tools
      - name: Unit tests
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Dashboard security tests
        run: python3 tests/security_check.py --start
      - name: Front-end tests (web/js, Node's own test runner)
        run: node --test tests/js/*.test.js

  app:
    name: Web app (API types, lint, unit and browser tests, build)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install (exact versions from the lock file, no install scripts)
        run: npm ci
      - name: API types match the engine's route table
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - name: Unit and screen tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests (Chromium, mocked engine)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  pip:
    name: pip install
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install ".[map]"
          cd "$RUNNER_TEMP"
          venv/bin/meshdoctor help
          venv/bin/meshdoctor config
          venv/bin/python -c "import importlib.resources as r, meshdoctor; print(sorted(p.name for p in (r.files(meshdoctor) / 'web').iterdir())); assert (r.files(meshdoctor) / 'web' / 'js' / 'md.js').is_file()"
          venv/bin/python -c "import importlib.resources as r, meshdoctor, sys; sys.path.insert(0, str(r.files(meshdoctor))); import schema; s = sorted(p.name for p in (r.files(meshdoctor) / 'schemas').iterdir()); print(s); assert s == sorted(k + '.schema.json' for k in schema.VERSIONS), s"
          echo '{"schemaVersion": "1.0", "x": 1}' > bad.json
          ! venv/bin/meshdoctor schema map bad.json
          venv/bin/python -c "import importlib.resources as r, meshdoctor, sys; sys.path.insert(0, str(r.files(meshdoctor))); import api_v1; d = api_v1.openapi(); assert d['openapi'] == '3.1.0'; print(len(d['paths']), 'API paths')"

  openfoam:
    name: README install + motorBike integration (OpenFOAM 14)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenFOAM 14 (openfoam.org packages)
        run: |
          sudo sh -c "wget -qO /etc/apt/trusted.gpg.d/openfoam.asc https://dl.openfoam.org/gpg.key"
          echo "deb http://dl.openfoam.org/ubuntu jammy main" | sudo tee /etc/apt/sources.list.d/openfoam.list
          sudo apt-get update && sudo apt-get install -y --no-install-recommends openfoam14 python3-numpy
      - name: Build and self-test (README steps)
        shell: bash
        run: |
          . /opt/openfoam14/etc/bashrc
          ./Allwmake
          bin/meshdoctor check
      - name: motorBike integration test
        shell: bash
        run: |
          . /opt/openfoam14/etc/bashrc
          NP=2 tests/integration_motorbike.sh

  docker:
    name: Docker image
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t meshdoctor .
      - name: Self-test inside the image
        run: docker run --rm meshdoctor check
      - name: Security tests against the container (published on 127.0.0.1 only)
        run: |
          docker run -d --name md -p 127.0.0.1:8765:8765 meshdoctor
          for i in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 1; done
          python3 tests/security_check.py 8765
          docker rm -f md
